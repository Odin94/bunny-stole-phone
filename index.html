<!DOCTYPE html>
<html lang="en" style="height: 100%">

<head>
    <meta charset=" UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bunny</title>
</head>

<body style="width: 100%; height: 100%; margin: 0">
    <img id="imageid" width="800" height="600" src="portrait.jpg" alt="Bunny window">

    <script>
        window.matchMedia("(orientation: portrait)").addEventListener("change", e => {
            const isPortrait = e.matches;

            if (isPortrait) document.getElementById("imageid").src = "portrait.jpg"
            else document.getElementById("imageid").src = "landscape.jpg"
        })
    </script>
</body>

</html>
